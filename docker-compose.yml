services:
  searxng:
    image: searxng/searxng:2026.11.2-cccbc9e15
    container_name: sift-searxng
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
    volumes:
      - ./config/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped